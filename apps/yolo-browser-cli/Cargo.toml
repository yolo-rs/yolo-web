[package]
name = "yolo-browser-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified CLI for the YOLO Chromium-compatible Rust Browser (AI Agents + Humans)"

[[bin]]
name = "yolo-browser"
path = "src/main.rs"

[features]
default = ["render"]
render = ["yolo-browser/render"]
stealth = ["yolo-browser/stealth"]

[dependencies]
yolo-browser = { path = "../../crates/yolo-browser", default-features = false }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
