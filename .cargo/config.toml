[env]
RUST_TEST_THREADS = "1"
# Official CEF (Chromium Embedded Framework) binary distribution cache used by
# crates/yolo-chromium. cef-dll-sys downloads the pinned version here on first
# build; the directory is git-ignored.
CEF_PATH = { value = ".cef", relative = true }

[alias]
# Local runtime iteration only. Benchmark with the normal non-incremental build.
test-js = "nextest run --release --features render -p obscura-js --lib --config profile.release.package.obscura-js.incremental=true"
