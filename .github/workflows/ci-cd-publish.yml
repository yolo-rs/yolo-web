name: CI, Quality Gates & Universal Publish Matrix

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, Format, Typecheck & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Upstream Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Format Check
        run: bun run fmt:check || bun fmt --check

      - name: Lint Check
        run: bun lint

      - name: Typecheck
        run: bun check

      - name: Rust Unit Tests
        run: cargo test --lib --workspace --exclude yolo-browser-bin || cargo test -p obscura-ssrf -p obscura-dom -p euclid -p uluru -p fnv -p servo-svg -p kuchikiki -p bravebot-core -p adblock --lib

      - name: Bun Tests
        run: bun test packages/auth/test/auth.test.ts packages/web-cli/src/index.test.ts packages/knowledge-indexer/src/index.test.ts

      - name: Build AoT Web Executable
        run: bun run aot:web

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: yolo-web-aot-${{ matrix.os }}
          path: dist/web*

  publish-registries:
    name: Multi-Registry Publish (NPM, Crates.io, GitHub Releases)
    needs: quality-gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Upstream Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            for pkg in packages/*; do
              if [ -f "$pkg/package.json" ]; then
                cd "$pkg" && bun publish --access public || true
                cd - > /dev/null
              fi
            done
          fi

      - name: Publish Rust Crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            for crate in crates/*; do
              if [ -f "$crate/Cargo.toml" ]; then
                cargo publish --manifest-path "$crate/Cargo.toml" || true
              fi
            done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/web*
