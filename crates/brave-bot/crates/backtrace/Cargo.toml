[package]
name = "bravebot-backtrace"
description = "Crash reports: what a panic leaves on disk, and sending it to Backtrace on a later launch"
version = "0.20.0"
edition = "2024"
rust-version = "0.20.0"
license = "MPL-2.0"
repository = "https://github.com/brave/bravebot"


[dependencies]
bravebot-agent = { path = "../agent" }
bravebot-config = { path = "../config" }
bravebot-core = { path = "../core" }
bravebot-net = { path = "../net" }
bravebot-stamp = { path = "../stamp" }
rand = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
