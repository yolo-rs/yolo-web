[package]
name = "deno_ops"
version = "0.288.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/denoland/deno_core"
description = "Proc macro for writing Deno Ops"

[lib]
path = "./lib.rs"
proc-macro = true

[dependencies]
indexmap = "2.8.0"
proc-macro2 = "1"
quote = "1"
stringcase = "0.4.0"
strum = { version = "0.27.1", features = ["derive"] }
strum_macros = "0.27.1"
syn = { version = "2", features = ["full", "extra-traits"] }
syn-match = "0.3.1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1.4.1"
prettyplease = "0.2.31"
testing_macros = "1.0.0"
