[package]
name = "serde_v8"
version = "0.321.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/denoland/deno_core"
description = "Rust to V8 serialization and deserialization"

[lib]
path = "lib.rs"

[dependencies]
deno_error = { version = "0.7.0", path = "../../deno-error", features = ["serde_json", "serde", "url", "tokio"] }
num-bigint = { version = "0.4", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1.14", features = ["union"] }
thiserror = "2"
v8 = { version = "150.4.0", default-features = false }

[dev-dependencies]
bencher = "0.1"
serde_bytes = "0.11"
serde_json = "1"
