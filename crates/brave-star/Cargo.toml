[package]
name = "sta-rs"
version = "0.3.3"
authors = ["Alex Davidson <coela@alxdavids.xyz>"]
description = "Distributed Secret-Sharing for Threshold Aggregation Reporting (STAR privacy-preserving telemetry)"
documentation = "https://docs.rs/sta-rs"
repository = "https://github.com/brave/sta-rs"
keywords = ["crypto", "protocol", "privacy", "secret", "analytics"]
categories = ["cryptography", "algorithms"]
license = "MPL-2.0"
edition = "2018"

[lib]
name = "sta_rs"
path = "star/src/lib.rs"

[dependencies]
strobe-rs = "0.10.0"
adss = { path = "./adss", version = "0.2.3" }
ppoprf = { path = "./ppoprf", version = "0.5" }
rand = "0.8.5"
rand_core = "0.6.4"
zeroize = "1.5.5"

[dev-dependencies]
criterion = "0.5.1"
star-test-utils = { path = "./star/test-utils" }
rand = { version = "0.8.5", features = ["std"] }

[features]
star2 = []
