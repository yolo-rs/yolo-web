[package]
name = "yolo-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust browser automation and engine research facade integrating Servo-derived, Obscura, Brave, and Deno components; does not provide Chromium compatibility."

[features]
default = ["render"]
zig-ffi = ["dep:yolo-zig-ffi"]
render = [
    "obscura/render",
    "obscura-browser/render",
    "obscura-cdp/render",
    "obscura-js/render",
    "obscura-mcp/render",
    "obscura-render/paint",
]
stealth = [
    "obscura/stealth",
    "obscura-browser/stealth",
    "obscura-cdp/stealth",
    "obscura-js/stealth",
    "obscura-mcp/stealth",
    "obscura-net/stealth",
]

[dependencies]
# Consolidated Obscura crates
obscura = { workspace = true }
obscura-browser = { workspace = true }
obscura-cdp = { workspace = true }
obscura-dom = { workspace = true }
obscura-js = { workspace = true }
obscura-mcp = { workspace = true }
obscura-net = { workspace = true }
obscura-render = { workspace = true }
obscura-ssrf = { workspace = true }

# Consolidated Servo crates
html5ever = { workspace = true }
markup5ever = { workspace = true }
xml5ever = { path = "../servo-xml5ever" }
selectors = { workspace = true }
servo_arc = { workspace = true }
cssparser = { workspace = true }
euclid = { path = "../servo-euclid", features = ["serde"] }
smallvec = { workspace = true }
tendril = { workspace = true }
uluru = { path = "../servo-uluru" }
fnv = { path = "../servo-fnv" }
servo-svg = { path = "../servo-svg" }
servo-webvtt = { path = "../servo-webvtt" }
url = { workspace = true }

# Consolidated Brave crates
adblock = { workspace = true }
kuchikiki = { workspace = true }
bravebot-core = { workspace = true }

# Consolidated Deno & V8 runtime crates
deno_error = { workspace = true }
import_map = { workspace = true }
fastwebsockets = { workspace = true }
deno_media_type = { workspace = true }
deno_unsync = { workspace = true }
deno_unsafecell = { workspace = true }
deno_core_parking_lot = { workspace = true }
yolo-web-standards = { workspace = true }
yolo-zig-ffi = { version = "0.1.0", optional = true, features = ["link-yolo-zig"] }

# Async & serialization
tiny-skia = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
