[package]
name = "agent-browser"
version = "0.41.2"
edition = "2021"
autobins = false
description = "Fast browser automation CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/vercel-labs/agent-browser"
homepage = "https://agent-browser.dev"
readme = "../../docs/agent-browser/upstream-README.md"
keywords = ["browser", "automation", "ai", "cdp", "chrome"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "yolo-web"
path = "src/main.rs"

[features]
default = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
getrandom = "0.2"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
futures-util = "0.3"
url = { workspace = true }
uuid = { workspace = true }
image = { workspace = true }
reqwest = { workspace = true }
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
socket2 = "0.6"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

